<!DOCTYPE html>
<html lang="fr">
<head>
  
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (() => {
      if (!("serviceWorker" in navigator) || location.pathname.startsWith("/lecture/")) return;
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
      navigator.serviceWorker
        .register("/sw.js", { scope: "/", updateViaCache: "none" })
        .then((registration) => registration.update())
        .catch(() => {});
    })();
  </script>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=/textes/theologie/">
  <link rel="canonical" href="https://florianvallin.fr/textes/theologie/">
  <title>Redirection — Textes de théologie | Florian Vallin</title>
  <script>location.replace('/textes/theologie/');</script>
</head>
<body><p><a href="/textes/theologie/">Retour aux textes de théologie</a></p></body>
</html>
